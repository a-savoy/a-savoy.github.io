<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=0.9, minimum-scale=0.3, maximum-scale=5.0, user-scalable=yes">
<title>Chemical Messengers: Onset vs. Effect Duration</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

/* ── THEME VARIABLES ─────────────────────────────────────────────────────── */
:root {
  --bg:           #0d0f14;
  --surface:      #13161e;
  --border:       #262c3d;
  --text:         #f0f2fa;
  --text-muted:   #8f9ab8;
  --text-dim:     #6b7394;
  --axis:         #2a3045;
  --tip-bg:       #13161e;
  --tip-border:   #262c3d;
  --tip-sep:      #1e2330;
}
body.light {
  --bg:           #f4f5f8;
  --surface:      #ffffff;
  --border:       #ccd0db;
  --text:         #1a1d26;
  --text-muted:   #4a5272;
  --text-dim:     #8890a8;
  --axis:         #b0b8cc;
  --tip-bg:       #ffffff;
  --tip-border:   #ccd0db;
  --tip-sep:      #e2e5ee;
}

body {
  background: var(--bg);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 2rem 1rem 3rem;
  font-family: 'IBM Plex Sans', sans-serif;
  transition: background 0.25s;
  overflow-x: hidden;
}
@media (max-width: 700px) {
  body { padding: 0.5rem 0.5rem 2rem; }
}

/* ── SVG STRUCTURAL COLORS — managed by CSS so theme toggle works ─────────── */
/* Dark mode (default) */
.x-axis .domain, .x-axis line,
.y-axis .domain, .y-axis line       { stroke: #2a3045; }
.x-axis text, .y-axis text          { fill: #8f9ab8; }
.axis-label                         { fill: #8f9ab8; }
.title-text                         { fill: #eef0f8; }
.subtitle-text                      { fill: #6b7394; }
.legend-header                      { fill: #6b7394; }
.legend-label                       { fill: #c4cbe0; }
.legend-sub                         { fill: #4a5060; }
.legend-sym                         { fill: #8f9ab8; stroke: #8f9ab8; }
.legend-pct                         { fill: #8f9ab8; }

/* Light mode overrides */
body.light .x-axis .domain, body.light .x-axis line,
body.light .y-axis .domain, body.light .y-axis line      { stroke: #b0b8cc; }
body.light .x-axis text, body.light .y-axis text         { fill: #4a5272; }
body.light .axis-label                                    { fill: #4a5272; }
body.light .title-text                                    { fill: #1a1d26; }
body.light .subtitle-text                                 { fill: #8890a8; }
body.light .legend-header                                 { fill: #8890a8; }
body.light .legend-label                                  { fill: #2a3048; }
body.light .legend-sub                                    { fill: #8890a8; }
body.light .legend-sym                                    { fill: #6070a0; stroke: #6070a0; }
body.light .legend-pct                                    { fill: #6070a0; }

#theme-toggle {
  position: fixed;
  top: 18px;
  right: 22px;
  display: flex;
  align-items: center;
  gap: 8px;
  z-index: 200;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--text-muted);
  cursor: pointer;
  user-select: none;
}
#theme-toggle .switch {
  width: 36px;
  height: 20px;
  background: var(--border);
  border-radius: 10px;
  position: relative;
  transition: background 0.2s;
}
#theme-toggle .switch::after {
  content: '';
  position: absolute;
  width: 14px;
  height: 14px;
  background: var(--text-muted);
  border-radius: 50%;
  top: 3px;
  left: 3px;
  transition: left 0.2s, background 0.2s;
}
body.light #theme-toggle .switch::after {
  left: 19px;
  background: #4a5272;
}

#wrap { position: relative; width: 100%; max-width: 1010px; overflow: visible; }

#tip {
  position: fixed;
  background: var(--tip-bg);
  border: 1px solid var(--tip-border);
  border-radius: 4px;
  padding: 16px 18px;
  pointer-events: none;
  user-select: none;
  opacity: 0;
  transition: opacity 0.12s;
  cursor: text;
  width: 290px;
  max-width: calc(100vw - 20px);
  max-height: 80vh;
  overflow-y: auto;
  z-index: 100;
}
@media (max-width: 700px) {
  #tip { width: auto; min-width: 240px; padding: 12px 14px; font-size: 0.9em; }
  .tn { font-size: 13px !important; }
  .tsub { font-size: 10px !important; }
  .tl { min-width: 110px !important; font-size: 11px !important; }
  .tv { font-size: 11px !important; }
  .ts { font-size: 11px !important; }
  #theme-toggle { top: auto; bottom: 14px; right: 12px; }
}
.tsub { font-size: 11px; color: var(--text-muted); font-family: 'IBM Plex Mono', monospace; margin-bottom: 8px; line-height: 1.45; }
.tn { font-size: 15px; font-weight: 500; color: var(--text); margin-bottom: 2px;
      font-family: 'IBM Plex Mono', monospace; line-height: 1.4; }
.tn-full { font-size: 10px; color: var(--text-dim); font-family: 'IBM Plex Mono', monospace;
           margin-bottom: 8px; line-height: 1.4; font-style: italic; }
.tc { font-size: 12px; letter-spacing: 0.03em;
      margin-bottom: 10px; font-family: 'IBM Plex Mono', monospace; }
.tr { display: flex; gap: 8px; margin-bottom: 5px; }
.tl { font-size: 12px; color: var(--text-dim); font-family: 'IBM Plex Mono', monospace;
      min-width: 148px; flex-shrink: 0; }
.tv { font-size: 12px; color: var(--text-muted); font-family: 'IBM Plex Mono', monospace; }
.ts { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--tip-sep);
      font-size: 12px; color: var(--text-muted); line-height: 1.55;
      font-family: 'IBM Plex Mono', monospace; }

/* Smooth transitions for theme switching */
.x-axis .domain, .x-axis line, .x-axis text,
.y-axis .domain, .y-axis line, .y-axis text,
.axis-label, .title-text, .subtitle-text,
.legend-header, .legend-label, .legend-sub,
.legend-sym, .legend-pct {
  transition: stroke 0.3s ease, fill 0.3s ease;
}
</style>
</head>
<body>
<div id="theme-toggle" onclick="toggleTheme()">
  <span id="theme-label">Light</span>
  <div class="switch"></div>
</div>
<div id="wrap">
  <div id="tip">
    <div class="tn" id="tn"></div>
    <div class="tsub" id="tsub"></div>
    <div class="tc" id="tc"></div>
    <div class="ts"><span style="color:var(--text-dim); font-size:11px; display:block; margin-bottom:4px;">Function</span><span id="ts"></span></div>
    <div style="margin-top:10px; padding-top:10px; border-top:1px solid var(--tip-sep);"></div>
    <div class="tr"><span class="tl">Source location</span><span class="tv" id="trel"></span></div>
    <div class="tr"><span class="tl">Receptor location</span><span class="tv" id="tloc"></span></div>
    <div class="tr"><span class="tl">Receptor prevalence</span><span class="tv" id="trec"></span></div>
    <div class="tr"><span class="tl">Time to binding</span><span class="tv" id="to"></span></div>
    <div class="tr"><span class="tl">Effect duration</span><span class="tv" id="td"></span></div>
    <div class="tc" id="tcite" style="margin-top:9px; padding-top:9px; border-top:1px solid #1e2330; color:#5a6480; font-size:11px; line-height:1.55;"></div>
  </div>
</div>
<script>
// ── DATA ─────────────────────────────────────────────────────────────────────
// onset:     seconds from release to first receptor activation
// effectDur: seconds: downstream cellular effect duration (NOT mol half-life)
// reach:     meters (used only in tooltip now)
// role:      state function

// loc: predominant brain region of receptor expression
// cortex | subcortex | hypothalamus | distributed
// Sources: Allen Brain Cell Atlas; Herkenham et al. 1991; Zeisel et al. 2018 Cell;
//          + receptor autoradiography and scRNA-seq literature

const M = [
  // Fast neurotransmitters: nearly universal
  {n:"Glutamate (AMPA)", relLoc:"Cortical pyramidal neurons, hippocampus, cerebellum — widespread", displayName:"Glutamate", sub:"One of the two main ionotropic glutamate receptor subtypes", fullName:"Alpha-amino-3-hydroxy-5-methyl-4-isoxazolepropionic acid receptor",      cls:"fast",      onset:5e-4,   effectDur:0.010,   reach:2e-8,   receptorPct:90, loc:"distributed", role:"Fast excitatory substrate underlying neural circuit function; does not generate states itself but is reconfigured by them.",                                                                        cite:"Hestrin (1992), Activation and desensitization of glutamate-activated channels mediating fast excitatory synaptic currents in the visual cortex"},
  {n:"Glutamate (NMDA)", relLoc:"Cortical pyramidal neurons, hippocampus, cerebellum — widespread", displayName:"Glutamate", sub:"One of the two main ionotropic glutamate receptor subtypes", fullName:"N-methyl-D-aspartate receptor",      cls:"fast",      onset:1.5e-2, effectDur:0.200,   reach:2.5e-8, receptorPct:85, loc:"distributed", role:"Excitatory substrate and plasticity trigger; the voltage-dependent magnesium block means NMDA receptors require simultaneous presynaptic glutamate release and postsynaptic depolarization to open, functioning as coincidence detectors that underlie long-term synaptic strengthening and learning.",                                                           cite:"Lester & Jahr (1992), NMDA channel behavior depends on agonist affinity"},
  {n:"GABA", relLoc:"Cortical interneurons, hippocampus, cerebellum, striatum", displayName:"Gamma-aminobutyric acid (GABA)", sub:"Gamma-aminobutyric acid; the brain's primary inhibitory neurotransmitter",                cls:"fast",      onset:5e-4,   effectDur:0.025,   reach:2.5e-8, receptorPct:90, loc:"distributed", role:"The principal inhibitory neurotransmitter across all brain regions; does not generate states itself, but the balance between GABAergic inhibition and glutamatergic excitation determines whether any given state can be expressed and sustained.",                                                                                  cite:"Jayaraman, Thiran & Hess (1999), How fast does the gamma-aminobutyric acid receptor channel open?"},
  {n:"Glycine", relLoc:"Spinal cord interneurons, brainstem", displayName:"Glycine", sub:"Inhibitory amino acid neurotransmitter", fullName:"Glycine (inhibitory amino acid, spinal cord and brainstem)",               cls:"fast",      onset:3e-4,   effectDur:0.008,   reach:2.5e-8, receptorPct:35, loc:"subcortex",   role:"Inhibitory substrate in spinal and brainstem circuits; contributes to motor state gating and reflex regulation.",                                                   cite:"Lynch (2004), Molecular structure and function of the glycine receptor ion channel"},
  // Acetylcholine
  {n:"ACh: NMJ (nicotinic)", relLoc:"Spinal motor neurons, brainstem motor nuclei", displayName:"Acetylcholine (ACh)", sub:"Acetylcholine acting at the neuromuscular junction via nicotinic receptors", cls:"ach",       onset:6e-4,   effectDur:0.010,   reach:5e-8,   receptorPct:25, loc:"subcortex",   role:"Translates motor states into physical action; triggers muscle contraction when motor neurons fire.",                                                                                               cite:"Kuffler & Yoshikami (1975), The number of transmitter molecules in a quantum and its calcium dependence"},
  {n:"ACh: CNS (muscarinic)", relLoc:"Basal forebrain (nucleus basalis), brainstem (pedunculopontine nucleus)", displayName:"Acetylcholine (ACh)", sub:"Acetylcholine acting in the central nervous system via muscarinic receptors",cls:"ach",       onset:3e-1,   effectDur:300,     reach:1.5e-5, receptorPct:45, loc:"cortex",      role:"Promotes cortical arousal by desynchronizing thalamocortical activity; elevates wakefulness and sustained attention; blockade of muscarinic receptors, as with anticholinergic drugs, produces cognitive impairment — particularly memory encoding deficits and attention disruption — as well as sedation.",                                                                             cite:"McCormick (1992), Neurotransmitter actions in the thalamus and cerebral cortex and their role in neuromodulation of thalamocortical activity"},

  {n:"ATP (ionotropic P2X receptor)", relLoc:"Co-released from neurons and glia throughout CNS", displayName:"Adenosine triphosphate (ATP)", sub:"Adenosine triphosphate; the cell's primary energy currency, also used as a signaling molecule",             cls:"purine",    onset:2e-3,   effectDur:0.050,   reach:2.5e-8, receptorPct:30, loc:"distributed", role:"Fast purinergic signaling substrate; co-released with other transmitters; does not drive states on its own.",                                                                                                               cite:"North (2002), Molecular physiology of P2X receptors"},
  {n:"Adenosine (P1/A1 metabotropic receptor)", relLoc:"Astrocytes, enzymatic breakdown of extracellular ATP", displayName:"Adenosine", sub:"Breakdown product of ATP",     cls:"purine",    onset:1,      effectDur:600,     reach:2e-4,   receptorPct:60, loc:"distributed",   role:"Accumulates continuously during wakefulness and suppresses arousal via A1 receptor activation, producing increasing sleep propensity; adenosine receptor antagonism is the mechanism by which caffeine promotes wakefulness.",                                                      cite:"Porkka-Heiskanen et al. (1997), Adenosine: a mediator of the sleep-inducing effects of prolonged wakefulness"},

  {n:"Dopamine", relLoc:"Ventral tegmental area (VTA), substantia nigra", displayName:"Dopamine", sub:"Catecholamine", fullName:"Dopamine (monoamine, mesolimbic and nigrostriatal circuits)",              cls:"mono",      onset:1.5e-1, effectDur:300,     reach:5e-6,   receptorPct:30, loc:"distributed", role:"Mediates reward anticipation, motivational arousal, and action selection; encodes reward prediction error — the difference between expected and received reward — and thereby biases behavioral states toward reward-seeking.",                                                                 cite:"Schultz et al. (1997), A neural substrate of prediction and reward"},

// ── FORMAT HELPERS ────────────────────────────────────────────────────────────
// Format a time in seconds. Only show a decimal when the value isn't a
// whole number: e.g. "1.5 s" but "2 s", "100 ms" but "0.5 ms".
function fmt(val, unit) {
  return (val % 1 === 0 ? val.toFixed(0) : val.toFixed(1)) + " " + unit;
}
function fT(s) {
  if (s < 1e-3)  return fmt(s*1e6, "μs");
  if (s < 1)     return fmt(s*1e3, "ms");
  if (s < 60)    return fmt(s,     "s");
  if (s < 3600)  return fmt(s/60,  "min");
  if (s < 86400) return fmt(s/3600,"hr");
  if (s < 604800)return fmt(s/86400,"days");
  if (s < 2.6e6) return fmt(s/604800,"wks");
  return fmt(s/2.6e6, "mos");
}

function ratioLabel(dur, onset) {
  const r = dur / onset;
  if (r < 2)   return "≈ 1× (no amplification)";
  if (r < 10)  return `~${r.toFixed(0)}× (modest cascade)`;
  if (r < 100) return `~${r.toFixed(0)}× (sustained cascade)`;
  return `~${Math.round(r/100)*100}× (major amplification)`;
}

// ── JITTER ────────────────────────────────────────────────────────────────────
// A small deterministic offset per point prevents exact overlap when molecules
// share very similar onset/duration values (e.g. the hormone cluster at x=systemic).
// We use a seeded pseudo-random based on the molecule name so positions are stable
// across renders. Jitter is ±8px in each axis: small enough not to mislead,
// large enough to separate stacked symbols.
function strHash(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = Math.imul(31, h) + s.charCodeAt(i) | 0;
  return h;
}
function jitter(name, axis) {
  const h = strHash(name + axis);
  return ((h & 0xffff) / 0xffff - 0.5) * 40;  // ±20 px
}
// Custom hexagon symbol for hypothalamus (D3 has no built-in hexagon)
const symbolHexagon = {
  draw(context, size) {
    const r = Math.sqrt(size / (1.5 * Math.sqrt(3)));
    for (let i = 0; i < 6; i++) {
      const angle = (Math.PI / 3) * i - Math.PI / 6;
      i === 0 ? context.moveTo(r * Math.cos(angle), r * Math.sin(angle))
              : context.lineTo(r * Math.cos(angle), r * Math.sin(angle));
    }
    context.closePath();
  }
};

const szSc = d3.scaleSqrt().domain([3, 95]).range([3.5, 11]);

  const r = szSc(pct);

}

const tip = document.getElementById("tip");
let activeDot = null;

function showTip(d) {
  document.getElementById("tn").textContent = d.displayName || d.n;
  document.getElementById("tsub").textContent = d.sub || "";
  const tc = document.getElementById("tc"); tc.textContent = CLASS_LABELS[d.cls]; tc.style.color = COLORS[d.cls];
  document.getElementById("to").textContent  = fT(d.onset);
  document.getElementById("td").textContent  = fT(d.effectDur);
  document.getElementById("trec").textContent = "~" + d.receptorPct + "% of brain neurons";
  document.getElementById("trel").textContent = d.relLoc || "";
  document.getElementById("tloc").textContent = LOC_LABELS[d.loc];
  document.getElementById("ts").textContent  = d.role;
  document.getElementById("tcite").textContent = d.cite;
  tip.style.opacity = 1;
}

function positionTip(clientX, clientY) {
  const th = tip.offsetHeight;
  const tw = tip.offsetWidth;
  let tx = clientX + 18;
  let ty = clientY - 12;
  if (tx + tw + 10 > window.innerWidth)  tx = clientX - tw - 10;
  if (ty + th + 10 > window.innerHeight) ty = clientY - th - 10;
  if (tx < 4) tx = 4;
  if (ty < 4) ty = 4;
  tip.style.left = tx + "px"; tip.style.top = ty + "px";
}

let pinned = false;  // whether the tooltip is click-pinned (desktop)

function hideTip(el, d) {
  const vis = dotVisible(d);
  d3.select(el)
    .attr("fill-opacity",   vis ? 0.82 : 0.07)
    .attr("stroke-width",   1.5)
    .attr("stroke-opacity", vis ? 0.5  : 0.0);
  tip.style.opacity = 0;
  tip.style.pointerEvents = "none";
  tip.style.userSelect = "none";
  activeDot = null;
  pinned = false;
}

function handleDotActivate(el, d, clientX, clientY) {
  // If tapping the same dot, dismiss
  if (activeDot === el) {
    hideTip(activeDot, d);
    return;
  }
  // Reset previous
  if (activeDot) {
    const prevD = d3.select(activeDot).datum();
    hideTip(activeDot, prevD);
  }
  activeDot = el;
  d3.select(el).attr("fill-opacity",1).attr("stroke-width",2.5).attr("stroke-opacity",0.95);
  showTip(d);
  positionTip(clientX, clientY);
}

function handleDismiss(ev) {
  if (!activeDot) return;
  const onDot = ev.target.classList && ev.target.classList.contains("dot");
  if (!onDot) {
    const prevD = d3.select(activeDot).datum();
    hideTip(activeDot, prevD);
  }
}

if (isMobile) {
  tip.style.width = Math.min(280, window.innerWidth - 20) + "px";

  // Use both touchstart and click for reliability across devices
  dots.on("touchstart", function(ev, d) {
    ev.preventDefault();
    ev.stopPropagation();
    const touch = ev.touches[0];
    handleDotActivate(this, d, touch.clientX, touch.clientY);
  }, {passive: false});

  dots.on("click", function(ev, d) {
    ev.stopPropagation();
    handleDotActivate(this, d, ev.clientX, ev.clientY);
  });

  document.addEventListener("touchstart", handleDismiss);
  document.addEventListener("click", handleDismiss);
} else {
  // Desktop: hover to preview, click to pin (selectable text), click elsewhere to dismiss
  dots.on("mouseover", function(ev, d) {
    if (pinned) return;
    d3.select(this).attr("fill-opacity",1).attr("stroke-width",2.5).attr("stroke-opacity",0.95);
    showTip(d);
  }).on("mousemove", function(ev) {
    if (pinned) return;
    positionTip(ev.clientX, ev.clientY);
  }).on("mouseout", function(ev, d) {
    if (pinned) return;
    hideTip(this, d);
  }).on("click", function(ev, d) {
    ev.stopPropagation();
    // If clicking the same dot while pinned, dismiss
    if (pinned && activeDot === this) {
      hideTip(activeDot, d);
      return;
    }
    // If pinned on a different dot, dismiss old one first
    if (pinned && activeDot) {
      const prevD = d3.select(activeDot).datum();
      hideTip(activeDot, prevD);
    }
    activeDot = this;
    pinned = true;
    d3.select(this).attr("fill-opacity",1).attr("stroke-width",2.5).attr("stroke-opacity",0.95);
    showTip(d);
    positionTip(ev.clientX, ev.clientY);
    tip.style.pointerEvents = "auto";
    tip.style.userSelect = "text";
  });

  document.addEventListener("click", function(ev) {
    if (!pinned || !activeDot) return;
    // Don't dismiss if clicking inside the tooltip
    if (tip.contains(ev.target)) return;
    const onDot = ev.target.classList && ev.target.classList.contains("dot");
    if (!onDot) {
      const prevD = d3.select(activeDot).datum();
      hideTip(activeDot, prevD);
    }
  });
}

// ── FILTER STATE ─────────────────────────────────────────────────────────────
// Each set holds the currently ACTIVE (visible) keys.
// Empty set means "show all" for that category.
const activeClasses = new Set();
const activeLocs    = new Set();
let   minPct        = 0;  // minimum receptor prevalence threshold (0 = show all)

// References to legend rows so we can update their visual state on click
const classRows = {};
const locRows   = {};
const pctRows   = {};  // keyed by pct threshold value

function dotVisible(d) {
  const clsOk  = activeClasses.size === 0 || activeClasses.has(d.cls);
  const locOk  = activeLocs.size    === 0 || activeLocs.has(d.loc);
  const pctOk  = d.receptorPct >= minPct;
  return clsOk && locOk && pctOk;
}

function applyFilters() {
  // Update dot visibility
  dots.each(function(d) {
    const vis = dotVisible(d);
    d3.select(this)
      .attr("fill-opacity",   vis ? 0.82 : 0.07)
      .attr("stroke-opacity", vis ? 0.5  : 0.0)
      .style("pointer-events", vis ? "auto" : "none");
  });

  // Update class legend row appearance
  Object.entries(classRows).forEach(([key, row]) => {
    const active = activeClasses.size === 0 || activeClasses.has(key);
    row.attr("opacity", active ? 1 : 0.25);
  });

  // Update location legend row appearance
  Object.entries(locRows).forEach(([key, row]) => {
    const active = activeLocs.size === 0 || activeLocs.has(key);
    row.attr("opacity", active ? 1 : 0.25);
  });

  // Update prevalence legend row appearance
  Object.entries(pctRows).forEach(([pct, row]) => {
    const active = Number(pct) === minPct;
    row.attr("opacity", active ? 1 : (minPct === 0 ? 1 : 0.25));
  });
  // When no threshold is set all three are fully visible; only dim below threshold
  if (minPct > 0) {
    Object.entries(pctRows).forEach(([pct, row]) => {
      row.attr("opacity", Number(pct) >= minPct ? 1 : 0.25);
    });
  }
}

// ── LEGEND ────────────────────────────────────────────────────────────────────
const isPortrait = isMobile && window.innerHeight > window.innerWidth;
const legFS = isMobile ? "10px" : "12px";
const legHeaderFS = isMobile ? "9px" : "10.5px";
const legRowH = isMobile ? 14 : 16;

// Column positions: on portrait mobile, Class on left, Location+Prevalence on right
const legCol1X = isMobile ? mg.left : mg.left + W + 22;
const legCol2X = isPortrait ? mg.left + 190 : legCol1X; // right column for portrait
const legTopY = isMobile ? mg.top + H + mg.bottom + 10 : mg.top;

// ── CLASS legend (always column 1)
let ly = legTopY;
svg.append("text").attr("x",legCol1X).attr("y",ly)
  .style("fill", "var(--text-dim)").attr("font-family","IBM Plex Mono,monospace")
  .attr("font-size",legHeaderFS).attr("letter-spacing","0.14em").attr("class","legend-header").text("CLASS");
ly += 15;

Object.entries(CLASS_LABELS).forEach(([key, label]) => {
  const row = svg.append("g")
    .attr("transform", `translate(${legCol1X},${ly})`)
    .style("cursor", "pointer")
    .style("pointer-events", "all")
    .on("click", function() {
      if (activeClasses.has(key)) {
        activeClasses.delete(key);
      } else {
        activeClasses.add(key);
      }
      applyFilters();
    });

  // Invisible hit-target covering the full row
  row.append("rect").attr("x",0).attr("y",-8).attr("width",130).attr("height",16).attr("fill","transparent");

  row.append("circle").attr("cx",5).attr("cy",-1).attr("r",5)
    .attr("fill", COLORS[key]).attr("fill-opacity", 0.88);
  row.append("text").attr("x",15).attr("y",3)
    .style("fill", "var(--text-muted)").attr("font-family","IBM Plex Mono,monospace")
    .attr("class","legend-label").attr("font-size",legFS).text(label);

  classRows[key] = row;
  ly += legRowH;
});

// ── RECEPTOR LOCATION legend (column 2 on portrait, else continues below)
let ly2 = isPortrait ? legTopY : ly + 12;
const locLegX = isPortrait ? legCol2X : legCol1X;

svg.append("text").attr("x",locLegX).attr("y",ly2)
  .style("fill", "var(--text-dim)").attr("font-family","IBM Plex Mono,monospace")
  .attr("font-size",legHeaderFS).attr("letter-spacing","0.14em").attr("class","legend-header").text("RECEPTOR LOCATION");
ly2 += 15;

Object.entries(LOC_LABELS).forEach(([key, label]) => {
  const row = svg.append("g")
    .attr("transform", `translate(${locLegX + 6},${ly2})`)
    .style("cursor", "pointer")
    .style("pointer-events", "all")
    .on("click", function() {
      if (activeLocs.has(key)) {
        activeLocs.delete(key);
      } else {
        activeLocs.add(key);
      }
      applyFilters();
    });

  // Invisible hit-target covering the full row
  row.append("rect").attr("x",-6).attr("y",-8).attr("width",140).attr("height",16).attr("fill","transparent");

  row.append("path")
    .attr("d", d3.symbol().type(SHAPES[key]).size(60)())
    .attr("class","legend-sym").style("fill", "var(--text-muted)").attr("fill-opacity",0.7)
    .style("stroke", "var(--text-muted)").attr("stroke-width",1).attr("stroke-opacity",0.6);
  row.append("text").attr("x",14).attr("y",4)
    .attr("class","legend-label").attr("font-family","IBM Plex Mono,monospace")
    .attr("font-size",legFS).style("fill","var(--text-muted)").text(label);

  locRows[key] = row;
  ly2 += isMobile ? 15 : 17;
});

// ── RECEPTOR PREVALENCE legend (same column as location)
ly2 += 10;
svg.append("text").attr("x",locLegX).attr("y",ly2)
  .style("fill", "var(--text-dim)").attr("font-family","IBM Plex Mono,monospace")
  .attr("font-size",legHeaderFS).attr("letter-spacing","0.14em").attr("class","legend-header").text("RECEPTOR PREVALENCE");
ly2 += 13;
svg.append("text").attr("x",locLegX).attr("y",ly2)
  .style("fill", "var(--text-dim)").attr("font-family","IBM Plex Mono,monospace")
  .attr("font-size", isMobile ? "8px" : "9px").attr("class","legend-sub").text(isMobile ? "tap to set minimum" : "click to set minimum threshold");
ly2 += 14;

[{pct:10,lbl:"≥ 10%"},{pct:40,lbl:"≥ 40%"},{pct:85,lbl:"≥ 85%"}].forEach(s => {
  const r = szSc(s.pct);
  const row = svg.append("g")
    .attr("transform", `translate(${locLegX + 1},${ly2})`)
    .style("cursor", "pointer")
    .style("pointer-events", "all")
    .on("click", function() {
      minPct = (minPct === s.pct) ? 0 : s.pct;
      applyFilters();
    });

  // Invisible hit-target so the full row area is clickable
  row.append("rect")
    .attr("x", 0).attr("y", -r)
    .attr("width", 120).attr("height", r * 2 + 6)
    .attr("fill", "transparent");

  row.append("circle").attr("cx", r).attr("cy", 0).attr("r", r)
    .attr("class","legend-sym").style("fill", "var(--text-muted)").attr("fill-opacity",0.3)
    .style("stroke", "var(--text-muted)").attr("stroke-opacity",0.5).attr("stroke-width",1);
  row.append("text").attr("x", r*2 + 6).attr("y", 4)
    .attr("class","legend-pct").style("fill", "var(--text-muted)").attr("font-family","IBM Plex Mono,monospace")
    .attr("font-size","11px").text(s.lbl);

  pctRows[s.pct] = row;
  ly2 += r * 2 + 7;
});

// Footnote below legend
const footY = Math.max(ly, ly2) + 16;
const footX = isMobile ? mg.left : mg.left + W + 22;
const footFS = isMobile ? "7px" : "9px";
const footWrap = isMobile ? 180 : 200;
const footnoteText = "*Time from molecular release to first cellular effect. For fast ion channels this equals binding time; for G-protein-coupled receptors it includes the signaling cascade; for gasotransmitters it is diffusion to intracellular targets.";
// Word-wrap the footnote into the available width
const footWords = footnoteText.split(" ");
let footLine = "";
let footLineY = footY;
footWords.forEach(word => {
  const testLine = footLine ? footLine + " " + word : word;
  // Approximate: ~5.5px per char at 9px font, ~4.2px at 7px
  const charW = isMobile ? 4.2 : 5.5;
  if (testLine.length * charW > footWrap && footLine) {
    svg.append("text").attr("x", footX).attr("y", footLineY)
      .attr("font-family","IBM Plex Mono,monospace").attr("font-size",footFS)
      .attr("class","subtitle-text").style("fill", "var(--text-dim)").text(footLine);
    footLineY += isMobile ? 10 : 13;
    footLine = word;
  } else {
    footLine = testLine;
  }
});
if (footLine) {
  svg.append("text").attr("x", footX).attr("y", footLineY)
    .attr("font-family","IBM Plex Mono,monospace").attr("font-size",footFS)
    .attr("class","subtitle-text").style("fill", "var(--text-dim)").text(footLine);
}

// ── THEME TOGGLE ──────────────────────────────────────────────────────────────
// Because D3 bakes colors into SVG attributes at render time, toggling a CSS
// class on <body> won't update them retroactively. Instead we re-read the CSS
// variables after the class change and push the new values back into the SVG.

function repaintStructural() {
  const muted  = "var(--text-muted)";
  const dim    = "var(--text-dim)";
  const text   = "var(--text)";
  const axis   = "var(--axis)";
  const bg     = "var(--bg)";

  // Background
  bgRect.attr("fill", bg);

  // Grid lines

  // Axis lines and ticks
  svg.selectAll(".x-axis .domain, .x-axis line").attr("stroke", axis);
  svg.selectAll(".y-axis .domain, .y-axis line").attr("stroke", axis);
  svg.selectAll(".x-axis text, .y-axis text").attr("fill", muted);

  // Axis labels
  svg.selectAll(".axis-label").attr("fill", muted);

  // Title and subtitle
  svg.selectAll(".title-text").attr("fill", text);
  svg.selectAll(".subtitle-text").attr("fill", dim);

  // Legend headers
  svg.selectAll(".legend-header").attr("fill", dim);
  // Legend item labels
  svg.selectAll(".legend-label").attr("fill", muted);
  // Legend sub-text
  svg.selectAll(".legend-sub").attr("fill", dim);
  // Size/shape legend symbols
  svg.selectAll(".legend-sym").attr("fill", muted).attr("stroke", muted);
  // Size legend pct labels
  svg.selectAll(".legend-pct").attr("fill", muted);
}


</script>
<script>
function toggleTheme() {
  const isLight = document.body.classList.toggle("light");
  document.getElementById("theme-label").textContent = isLight ? "Dark" : "Light";
}
</script>
